version: 1
backend:
  phases:
    build:
      commands:
        # Amplify's backend tools need Node 20+
        - nvm use 20 || nvm install 20
        - node --version
        - npm ci --cache .npm --prefer-offline
        # Deploys the member-data backend (amplify/ folder) and writes amplify_outputs.json
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - nvm use 20 || nvm install 20
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
