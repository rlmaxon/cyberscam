version: 1
backend:
  phases:
    build:
      commands:
        # Node 22: Amplify's backend tooling includes packages that require it
        - nvm use 22 || nvm install 22
        - node --version && npm --version
        # npm install (not npm ci): npm ci wrongly rejects aws-cdk-lib's bundled
        # dependencies. npm install still uses the exact versions in package-lock.json.
        - npm install --cache .npm --prefer-offline --no-audit --no-fund
        # Deploys the member-data backend (amplify/ folder) and writes amplify_outputs.json
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - nvm use 22 || nvm install 22
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
